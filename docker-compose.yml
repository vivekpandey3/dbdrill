version: '3.8'

services:
  dbdrill:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dbdrill-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Mount host Docker daemon socket to enable sibling container drills
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

