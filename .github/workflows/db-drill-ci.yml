name: DBDrill Disaster Recovery CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run daily automated disaster drills at midnight UTC
    - cron: '0 0 * * *'

jobs:
  drill-validation:
    name: Verify Database Drills & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Pull Docker Base Images for Drills
        run: |
          docker pull postgres:16-alpine
          docker pull mongo:7.0

      - name: Execute Sample Dump Verification Suite
        run: npm run test:sample

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

